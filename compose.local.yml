# Used with compose.qdrant.yml; shares its existing project and Qdrant volume.
services:
  qdrant:
    image: qdrant/qdrant@sha256:12364fe851b9f17356fc88189fc06d1b521262e04659ec7345975b00c9246a10
  app:
    build: .
    image: ecom-agent-local:latest
    init: true
    command: ["python", "-m", "app.scripts.run_local_container"]
    env_file: .env
    environment:
      MCP_ENABLED: "true"
      MULTI_AGENT_ENABLED: "true"
      MCP_SERVER_URL: http://127.0.0.1:9123/mcp
      QDRANT_URL: http://qdrant:6333
    ports:
      - "127.0.0.1:18000:8000"
    volumes:
      - ./app/sessions:/app/app/sessions
      - ./app/agent/rag/knowledge:/app/app/agent/rag/knowledge:ro
      - reranker-cache:/root/.cache/huggingface
    depends_on:
      qdrant:
        condition: service_started
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-m", "app.scripts.run_local_container", "--health"]
      interval: 30s
      timeout: 15s
      start_period: 60s
      retries: 3

volumes:
  reranker-cache:
