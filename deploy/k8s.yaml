apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: xiaofei-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xiaofei-customer-service
spec:
  # CR-02/03：当前文件会话与 SQLite 只支持单实例；共享状态改造前禁止扩容。
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: xiaofei-customer-service
  template:
    metadata:
      labels:
        app: xiaofei-customer-service
    spec:
      containers:
        - name: api
          image: your-registry/xiaofei-customer-service:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: xiaofei-api-secrets
          env:
            - name: SERVER_MAX_CONCURRENCY
              value: "32"
            - name: SERVER_MAX_SESSIONS
              value: "1000"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: sessions
              mountPath: /app/app/sessions
      volumes:
        - name: sessions
          persistentVolumeClaim:
            claimName: xiaofei-data
---
apiVersion: v1
kind: Service
metadata:
  name: xiaofei-customer-service
spec:
  selector:
    app: xiaofei-customer-service
  ports:
    - port: 80
      targetPort: 8000
